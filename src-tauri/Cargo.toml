[package]
name = "notebooklm_desktop"
version = "0.1.0"
description = "NotebookLM desktop shell (Tauri 2)"
authors = ["NotebookLM contributors"]
edition = "2021"

[lib]
name = "notebooklm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["path"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
http = "1"
futures-util = "0.3"
tracing = "0.1"
