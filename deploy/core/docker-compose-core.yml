# 应用核心服务，依赖中间件。与中间件一起启动示例：
#   docker compose -f deploy/docker-compose-middleware.yml -f deploy/docker-compose-core.yml up -d
# 仅启动中间件：
#   docker compose -f deploy/docker-compose-middleware.yml up -d
x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-180}
    UV_HTTP_RETRIES: ${UV_HTTP_RETRIES:-5}
    UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}

services:
  # FastAPI backend
  backend:
    build: *backend-build
    env_file:
      - ./.env
    # environment:
      # - MILVUS_URI=http://milvus:19530
      # Deep Research：deer-flow 部署在远端网关（覆盖 .env 中的 DEER_FLOW_BASE_URL）
      # - DEER_FLOW_BASE_URL=http://47.118.30.86:2026
    ports:
      - "8000:8000"
    environment:
      LOG_DIR: /app/logs
    volumes:
      - ./backend:/app
      - ./config.yaml:/app/config.yaml:ro
      - upload_data:/app/uploads
      - ./logs:/app/logs
    restart: always
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Vue 3 frontend (dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  upload_data:
