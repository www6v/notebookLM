[project]
name = "notebooklm-backend"
version = "0.1.0"
description = "NotebookLM backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.1.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "httpx>=0.28.0",
    "dashscope>=1.20.0",
    "beautifulsoup4>=4.12.3",
    "Jinja2>=3.1.4",
    "websockets>=14.1",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0,<3.0.0",
    "rapidocr>=3.0.0,<4.0.0",
    # Cap below 1.24: 1.24+ ships macOS wheels only for arm64 / macOS 14+,
    # breaking Intel macOS 13 (macosx_13_0_x86_64) local installs.
    "onnxruntime>=1.16.0,<1.24",
    # 4.13+ Intel wheels target macosx_14_0_x86_64 only; headless drops GUI
    # stack and shrinks Linux images vs opencv-python.
    "opencv-python-headless>=4.8.0,<4.13",
    "python-pptx>=0.6.21",
    "pymupdf>=1.23.0",
    "celery[redis]>=5.3.0",
    "redis>=5.2.0",
    "deepsearcher>=0.0.2",
    "firecrawl-py>=2.5.3,<3.0.0",
    "oss2>=2.18.0",
    "litellm>=1.0.0",
    "langfuse>=2.0.0",
    "pymilvus>=2.5.0",
    "alipay-sdk-python>=3.7.0",
    "wechatpayv3>=1.2.0",
    "python-dateutil>=2.9.0",
    "yt-dlp>=2024.1.0",
    "json-repair>=0.58.7",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
