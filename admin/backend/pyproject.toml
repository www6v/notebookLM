[project]
name = "notebooklm-admin-backend"
version = "0.1.0"
description = "Admin backend for notebookLM"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.18",
    "notebooklm-shared",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
notebooklm-shared = { path = "../../shared", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
